name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fivechess-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild FiveChess.sln /m /p:Configuration=Release /p:Platform=Win32 /p:RestorePackages=false

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -File -Filter FiveChess.exe |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1

          if (-not $exe) {
            throw 'FiveChess.exe was not found after the Release build.'
          }

          $package = Join-Path $PWD 'artifacts\FiveChess-v2.2-Windows'
          New-Item -ItemType Directory -Force -Path $package | Out-Null

          Copy-Item $exe.FullName (Join-Path $package 'FiveChess.exe')
          Set-Content -Path (Join-Path $package 'VERSION.txt') -Value '2.2.0' -Encoding ascii

          @'
          FiveChess 2.2
          Author: Yuansheng Li (李源晟)

          Windows C++ / MFC Gomoku desktop application.

          Controls:
          - New game: F2 or Ctrl+N
          - Undo: Ctrl+Z
          - Game settings: use the button in the right panel
          '@ | Set-Content -Path (Join-Path $package 'README.txt') -Encoding utf8

          Write-Host "Packaged executable from: $($exe.FullName)"
          Get-ChildItem $package | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiveChess-v2.2-Windows
          path: artifacts/FiveChess-v2.2-Windows
          if-no-files-found: error
          retention-days: 30
